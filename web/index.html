<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indonesia Realtime Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --ink:#1D2A33; --muted:#5D6D78; --rule:#CBD5DB; --panel:#FFFFFF; --sea:#DCE6EA;
    --m3:#8FB3C4; --m4:#E9B44C; --m5:#D9722E; --m6:#A3261E;
    --fire:#6B1E0A;
    --ok:#3E8E5E; --warn:#D9A21E; --fail:#B3261E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Barlow,system-ui,sans-serif;color:var(--ink);background:var(--sea)}
  .app{display:grid;grid-template-columns:380px 1fr;height:100%}
  aside{background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
  header{padding:20px 20px 14px;border-bottom:1px solid var(--rule)}
  h1{font-size:1.5rem;line-height:1.15;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:.9rem;margin:0}
  .ask-link{display:inline-block;margin:2px 0 6px;font-size:.88rem;font-weight:600;color:#2E5E8C;text-decoration:none;border-bottom:1px solid currentColor}
  .filters{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  select{font:inherit;font-size:.9rem;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink)}
  select:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .tabs{display:flex;border-bottom:1px solid var(--rule)}
  .tab{flex:1;padding:10px 4px;border:0;background:none;font:inherit;font-weight:600;font-size:.92rem;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  .list{overflow-y:auto;flex:1;min-height:0}
  .row{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;width:100%;
       padding:12px 20px;border:0;border-bottom:1px solid #EEF2F4;background:none;text-align:left;
       font:inherit;color:inherit;cursor:pointer}
  .row:hover{background:#F5F8F9}
  .big{font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .aqi-chip{display:inline-block;min-width:52px;text-align:center;padding:6px 4px;border-radius:6px;font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums}
  .title{font-weight:500;font-size:.95rem;line-height:1.3}
  .meta{color:var(--muted);font-size:.82rem;margin-top:2px;font-variant-numeric:tabular-nums}
  .empty{padding:24px 20px;color:var(--muted);font-size:.95rem}
  .health{border-top:1px solid var(--rule);padding:12px 20px 16px;font-size:.84rem;max-height:34vh;overflow-y:auto}
  .health h2{font-size:.95rem;margin:0 0 8px;font-weight:600}
  .check{display:grid;grid-template-columns:10px 92px 1fr auto;gap:8px;align-items:center;padding:2px 0}
  .dot{width:10px;height:10px;border-radius:50%}
  .dot.pass{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.fail{background:var(--fail)}
  .val{font-variant-numeric:tabular-nums;color:var(--muted)}
  #map{height:100%;width:100%}
  .legend{background:#fff;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font:500 .8rem Barlow,sans-serif;color:var(--ink);line-height:1.6}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 8px;vertical-align:-1px}
  .legend i:first-of-type{margin-left:0}
  .news-marker{width:10px;height:10px;background:#2E5E8C;border:2px solid #fff;transform:rotate(45deg);box-shadow:0 0 0 1px #2E5E8C}
  .chip.loc{background:#DDE8F3}
  .aqi-marker{border-radius:5px;font:700 11px/20px Barlow,sans-serif;text-align:center;border:1px solid rgba(0,0,0,.35)}
  .news-filter{padding:10px 20px;border-bottom:1px solid #EEF2F4}
  .news{display:block;padding:12px 20px;border-bottom:1px solid #EEF2F4;color:inherit;text-decoration:none}
  .news:hover{background:#F5F8F9}
  .news .title{font-weight:600}
  .chip{display:inline-block;font-size:.75rem;padding:1px 7px;border-radius:10px;background:#E6EDF1;color:var(--ink);margin:4px 4px 0 0}
  .ask-box{padding:14px 20px;border-bottom:1px solid #EEF2F4}
  .ask-label{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
  #ask-q{width:100%;font:inherit;font-size:.95rem;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;resize:vertical;color:var(--ink)}
  #ask-q:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
  .ask-actions{display:flex;gap:10px;align-items:center;margin-top:8px}
  .ask-btn{font:inherit;font-weight:600;padding:7px 16px;border:0;border-radius:6px;background:var(--ink);color:#fff;cursor:pointer}
  .ask-btn[disabled]{opacity:.5;cursor:wait}
  .ask-examples{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .ask-ex{font:inherit;font-size:.8rem;padding:4px 9px;border:1px solid var(--rule);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;text-align:left}
  .ask-ex:hover{background:#F5F8F9}
  .ask-answer{padding:14px 20px;font-size:.95rem;line-height:1.5;white-space:pre-wrap}
  .ask-badge{display:block;padding:8px 20px 0;font-size:.78rem;color:var(--muted)}
  .ask-detail{padding:4px 20px 14px;font-size:.84rem}
  .ask-detail summary{cursor:pointer;color:var(--muted)}
  .ask-detail pre{white-space:pre-wrap;font-size:.75rem;background:#F5F8F9;padding:8px;border-radius:6px;max-height:240px;overflow:auto}
  .ask-facts{margin:6px 0 0;padding-left:18px;line-height:1.45}
  .ask-src a{display:block;color:#2E5E8C;margin-top:4px}
  .leaflet-popup-content{font-family:Barlow,sans-serif;font-size:.9rem}
  @media (max-width:760px){
    .app{grid-template-columns:1fr;grid-template-rows:55vh auto}
    aside{order:2;border-right:0;border-top:1px solid var(--rule)}
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>Indonesia Realtime Monitor</h1>
      <a href="/tanya.html" class="ask-link">Tanya Data dengan AI</a>
      <p class="sub" id="summary">Memuat data…</p>
      <div class="filters">
        <select id="hours" aria-label="Rentang waktu">
          <option value="24">24 jam terakhir</option>
          <option value="72" selected>3 hari terakhir</option>
          <option value="168">7 hari terakhir</option>
        </select>
        <select id="minmag" aria-label="Magnitudo minimum gempa">
          <option value="0">Semua magnitudo</option>
          <option value="4">M 4 ke atas</option>
          <option value="5">M 5 ke atas</option>
        </select>
      </div>
    </header>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="quake">Gempa</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="aq">Kualitas udara</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="news">Berita</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="food">Harga pangan</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="ask">Tanya AI</button>
    </div>
    <div class="list" id="list-quake" role="tabpanel"></div>
    <div class="list" id="list-aq" role="tabpanel" hidden></div>
    <div class="list" id="list-news" role="tabpanel" hidden>
      <div class="news-filter">
        <select id="news-topic" aria-label="Topik berita">
          <option value="">Semua topik</option>
          <option value="gempa">Gempa</option><option value="banjir_longsor">Banjir & longsor</option>
          <option value="kebakaran">Kebakaran hutan</option><option value="gunung_api">Gunung api</option>
          <option value="cuaca">Cuaca</option><option value="kualitas_udara">Kualitas udara</option>
          <option value="pangan">Pangan</option>
        </select>
      </div>
      <div id="news-items"></div>
    </div>
    <div class="list" id="list-food" role="tabpanel" hidden>
      <div class="news-filter">
        <select id="food-commodity" aria-label="Komoditas">
          <option value="1">Beras</option><option value="2">Daging ayam</option><option value="3">Daging sapi</option>
          <option value="4">Telur ayam</option><option value="5">Bawang merah</option><option value="6">Bawang putih</option>
          <option value="7">Cabai merah</option><option value="8">Cabai rawit</option><option value="9">Minyak goreng</option>
          <option value="10">Gula pasir</option>
        </select>
        <div class="meta" id="food-meta"></div>
      </div>
      <div id="food-items"></div>
      <div class="meta" style="padding:10px 20px">Sumber: PIHPS Nasional, Bank Indonesia (pasar tradisional).</div>
    </div>
    <div class="list" id="list-ask" role="tabpanel" hidden>
      <div class="ask-box">
        <label for="ask-q" class="ask-label">Tanya tentang data di platform ini
          <a href="/tanya.html" style="float:right;font-weight:500;font-size:.85rem;color:#2E5E8C">Buka layar penuh</a></label>
        <textarea id="ask-q" maxlength="300" rows="3" placeholder="Contoh: Berapa titik panas di Kalimantan Tengah 24 jam terakhir?"></textarea>
        <div class="ask-actions">
          <button id="ask-btn" class="ask-btn">Tanya</button>
          <span class="meta">Ctrl+Enter untuk kirim</span>
        </div>
        <div class="ask-examples" id="ask-examples"></div>
      </div>
      <div id="ask-result" aria-live="polite"></div>
    </div>
    <section class="health" aria-live="polite">
      <h2>Kesehatan pipeline</h2>
      <div id="health"><div class="val">Belum ada hasil pengecekan.</div></div>
    </section>
  </aside>
  <div id="map" role="region" aria-label="Peta"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const magColor = m => m >= 6 ? css('--m6') : m >= 5 ? css('--m5') : m >= 4 ? css('--m4') : css('--m3');
// Warna kategori US AQI (EPA)
const aqiCat = a => a <= 50 ? ['#00E400','#1D2A33','Baik'] : a <= 100 ? ['#FFFF00','#1D2A33','Sedang']
  : a <= 150 ? ['#FF7E00','#1D2A33','Tidak sehat bagi kelompok sensitif'] : a <= 200 ? ['#FF0000','#fff','Tidak sehat']
  : a <= 300 ? ['#8F3F97','#fff','Sangat tidak sehat'] : ['#7E0023','#fff','Berbahaya'];
const fmtTime = iso => new Date(iso).toLocaleString('id-ID', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

const map = L.map('map', {preferCanvas: true}).setView([-2.5, 118], 5);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors | Data: BMKG, USGS, NASA FIRMS, Open-Meteo, PIHPS-BI'
}).addTo(map);

const layers = {
  quake: L.layerGroup().addTo(map),
  fire: L.layerGroup().addTo(map),
  aq: L.layerGroup().addTo(map),
  news: L.layerGroup().addTo(map),
};
L.control.layers(null, {'Gempa': layers.quake, 'Titik panas (FIRMS)': layers.fire, 'Kualitas udara': layers.aq, 'Berita (lokasi)': layers.news},
  {collapsed: false, position: 'topright'}).addTo(map);

const legend = L.control({position:'bottomright'});
legend.onAdd = () => {
  const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = `Gempa <i style="background:${css('--m3')}"></i>&lt;4<i style="background:${css('--m4')}"></i>4–5
    <i style="background:${css('--m5')}"></i>5–6<i style="background:${css('--m6')}"></i>6+<br>
    Garis penuh BMKG, putus-putus USGS<br>
    <i style="background:${css('--fire')}"></i>Titik panas, makin besar makin kuat (FRP)<br>
    Kotak angka: US AQI per ibu kota provinsi<br>
    <span class="news-marker" style="display:inline-block;margin:0 6px 0 2px;width:8px;height:8px"></span>Berita, di ibu kota wilayah hasil geotag`;
  return d;
};
legend.addTo(map);

const counts = {quake: 0, fire: 0, aq: 0, news: 0};
const renderSummary = () => {
  $('summary').textContent = `${counts.quake} gempa, ${counts.fire.toLocaleString('id-ID')} titik panas, ` +
    `${counts.aq} kota terpantau, ${counts.news} berita. Diperbarui ${new Date().toLocaleTimeString('id-ID')}.`;
};

async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(`${url} → ${r.status}`);
  return r.json();
}

async function loadQuakes(){
  const h = $('hours').value, m = $('minmag').value, list = $('list-quake');
  try{
    const fc = await getJSON(`/api/earthquakes?hours=${h}&min_mag=${m}`);
    layers.quake.clearLayers(); list.innerHTML = '';
    counts.quake = fc.features.length;
    if(!fc.features.length){
      list.innerHTML = '<div class="empty">Tidak ada gempa pada rentang ini. Perluas rentang waktu atau turunkan magnitudo minimum.</div>';
    }
    for(const f of fc.features){
      const p = f.properties, [lon, lat] = f.geometry.coordinates, col = magColor(p.magnitude);
      const mk = L.circleMarker([lat, lon], {radius: 3 + p.magnitude * 2.2, color: col, weight: 2, fillColor: col,
        fillOpacity: .35, dashArray: p.source === 'usgs' ? '4 3' : null})
        .bindPopup(`<strong>M ${p.magnitude}</strong> ${esc(p.region)}<br>${fmtTime(p.time)}, kedalaman ${p.depth_km} km
          <br>Sumber: ${p.source.toUpperCase()}${p.felt ? '<br>Dirasakan: ' + esc(p.felt) : ''}`).addTo(layers.quake);
      const b = document.createElement('button');
      b.className = 'row';
      b.innerHTML = `<div class="big" style="color:${col}">${p.magnitude.toFixed(1)}</div>
        <div><div class="title">${esc(p.region)}</div><div class="meta">${fmtTime(p.time)}, ${p.depth_km} km, ${p.source.toUpperCase()}</div></div>`;
      b.onclick = () => { map.flyTo([lat, lon], 7, {duration: .8}); mk.openPopup(); };
      list.appendChild(b);
    }
  }catch(e){
    list.innerHTML = `<div class="empty">Data gempa gagal dimuat (${esc(e.message)}). Cek: <code>docker compose ps</code>.</div>`;
  }
  renderSummary();
}

async function loadFires(){
  const h = Math.min(+$('hours').value, 240);
  try{
    const fc = await getJSON(`/api/hotspots?hours=${h}`);
    layers.fire.clearLayers();
    counts.fire = fc.features.length;
    const fire = css('--fire');
    for(const f of fc.features){
      const p = f.properties, [lon, lat] = f.geometry.coordinates;
      L.circleMarker([lat, lon], {radius: Math.min(2 + Math.sqrt(p.frp || 0) / 2, 9), stroke: false,
        fillColor: fire, fillOpacity: .75})
        .bindPopup(`<strong>Titik panas</strong><br>${fmtTime(p.time)}<br>FRP ${p.frp} MW, confidence ${esc(p.confidence)}
          <br>${esc(p.satellite)} (${p.daynight === 'D' ? 'siang' : 'malam'})`).addTo(layers.fire);
    }
  }catch(e){ counts.fire = 0; }
  renderSummary();
}

async function loadAQ(){
  const list = $('list-aq');
  try{
    const rows = await getJSON('/api/air-quality/latest');
    layers.aq.clearLayers(); list.innerHTML = '';
    counts.aq = rows.length;
    if(!rows.length) list.innerHTML = '<div class="empty">Belum ada data kualitas udara. Producer mengambil data setiap 15 menit.</div>';
    for(const r of rows){
      const a = Math.round(r.us_aqi), [bg, fg, label] = aqiCat(a);
      const icon = L.divIcon({className: '', html: `<div class="aqi-marker" style="background:${bg};color:${fg}">${a}</div>`,
        iconSize: [30, 20], iconAnchor: [15, 10]});
      const mk = L.marker([r.lat, r.lon], {icon, title: r.city})
        .bindPopup(`<strong>${esc(r.city)}</strong>, ${esc(r.province)}<br>US AQI ${a} (${label})
          <br>PM2.5 ${r.pm2_5.toFixed(1)} µg/m³, PM10 ${r.pm10.toFixed(1)} µg/m³<br>${fmtTime(r.obs_time + 'Z')}`).addTo(layers.aq);
      const b = document.createElement('button');
      b.className = 'row';
      b.innerHTML = `<div><span class="aqi-chip" style="background:${bg};color:${fg}">${a}</span></div>
        <div><div class="title">${esc(r.city)}</div><div class="meta">${esc(r.province)}, ${label}, PM2.5 ${r.pm2_5.toFixed(1)}</div></div>`;
      b.onclick = () => { map.flyTo([r.lat, r.lon], 9, {duration: .8}); mk.openPopup(); };
      list.appendChild(b);
    }
  }catch(e){
    list.innerHTML = `<div class="empty">Data kualitas udara gagal dimuat (${esc(e.message)}).</div>`;
  }
  renderSummary();
}

const TOPIC_LABEL = {gempa:'Gempa', banjir_longsor:'Banjir & longsor', kebakaran:'Kebakaran hutan',
  gunung_api:'Gunung api', cuaca:'Cuaca', kualitas_udara:'Kualitas udara', pangan:'Pangan'};
async function loadNews(){
  const box = $('news-items'), t = $('news-topic').value;
  try{
    const rows = await getJSON(`/api/news?hours=48&topic=${encodeURIComponent(t)}`);
    counts.news = rows.length;
    box.innerHTML = rows.length ? rows.map(n => `
      <a class="news" href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">
        <div class="title">${esc(n.title)}</div>
        <div class="meta">${esc(n.publisher)}, ${fmtTime(n.published_at + 'Z')}</div>
        ${(n.summary_llm || n.summary) ? `<div class="meta">${esc(n.summary_llm || n.summary)}</div>` : ''}
        <div>${n.topics.map(x => `<span class="chip">${esc(TOPIC_LABEL[x] || x)}</span>`).join('')}${n.wilayah ? `<span class="chip loc">${esc(n.wilayah)}</span>` : ''}</div>
      </a>`).join('')
      : '<div class="empty">Belum ada berita. Berita diambil oleh Airflow setiap 15 menit (jalankan <code>make batch-up</code>).</div>';
  }catch(e){
    box.innerHTML = `<div class="empty">Berita gagal dimuat (${esc(e.message)}).</div>`;
  }
  renderSummary();
}

const rupiah = v => 'Rp' + Math.round(v).toLocaleString('id-ID');
async function loadFood(){
  const box = $('food-items'), c = $('food-commodity').value;
  try{
    const rows = await getJSON(`/api/food-prices/latest?commodity_id=${c}`);
    if(!rows.length){
      $('food-meta').textContent = '';
      box.innerHTML = '<div class="empty">Belum ada data harga. DAG food_price_ingest berjalan pukul 14.00 dan 18.00 WIB, atau trigger manual di Airflow.</div>';
      return;
    }
    const nat = rows[0].national_avg, max = Math.max(...rows.map(r => r.price));
    $('food-meta').textContent = `${rows[0].commodity}, ${new Date(rows[0].price_date).toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'})}. Rata-rata nasional ${rupiah(nat)}.`;
    box.innerHTML = rows.map(r => {
      const diff = (r.price - nat) / nat * 100, col = diff > 10 ? 'var(--fail)' : diff < -10 ? 'var(--ok)' : 'var(--muted)';
      const chg = r.pct_change ? ` · ${r.pct_change > 0 ? '+' : ''}${r.pct_change.toFixed(1)}% vs ${new Date(r.prev_date).toLocaleDateString('id-ID',{day:'numeric',month:'short'})}` : '';
      return `<div class="row" style="cursor:default">
        <div style="font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem">${rupiah(r.price)}</div>
        <div><div class="title">${esc(r.province)}</div>
          <div class="meta"><span style="color:${col}">${diff >= 0 ? '+' : ''}${diff.toFixed(1)}% dari nasional</span>${chg}</div>
          <div style="height:4px;background:#EEF2F4;border-radius:2px;margin-top:4px"><div style="height:4px;width:${(r.price / max * 100).toFixed(1)}%;background:${col};border-radius:2px"></div></div>
        </div></div>`;
    }).join('');
  }catch(e){
    box.innerHTML = `<div class="empty">Harga pangan gagal dimuat (${esc(e.message)}).</div>`;
  }
}

// Sebar sedikit titik berita yang berada di wilayah sama (deterministik per id)
const jitter = id => { let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) | 0; return [((h & 255) / 255 - .5) * .12, (((h >> 8) & 255) / 255 - .5) * .12]; };
async function loadNewsGeo(){
  try{
    const fc = await getJSON('/api/news/geo?hours=48');
    layers.news.clearLayers();
    const icon = L.divIcon({className: '', html: '<div class="news-marker"></div>', iconSize: [12, 12], iconAnchor: [6, 6]});
    for(const f of fc.features){
      const p = f.properties, [lon, lat] = f.geometry.coordinates, [dy, dx] = jitter(p.id);
      L.marker([lat + dy, lon + dx], {icon, title: p.title}).bindPopup(
        `<strong>${esc(p.title)}</strong><br>${esc(p.publisher)}, ${fmtTime(p.published_at + 'Z')}
         ${p.summary_llm ? `<br>${esc(p.summary_llm)}` : ''}<br>Lokasi: ${esc(p.wilayah)}${p.level === 2 ? ', ' + esc(p.provinsi) : ''}
         <br><a href="${esc(p.link)}" target="_blank" rel="noopener noreferrer">Baca di sumber</a>`).addTo(layers.news);
    }
  }catch(e){ /* layer berita opsional */ }
}

async function loadHealth(){
  try{
    const rows = await getJSON('/api/dq/latest');
    if(!rows.length) return;
    $('health').innerHTML = rows.map(r => `
      <div class="check" title="${esc(r.detail)}"><span class="dot ${r.status}"></span>
      <span>${esc(r.source)}</span><span>${esc(r.check.replace(/_/g,' '))}</span>
      <span class="val">${r.value < 0 ? 'n/a' : Number(r.value).toFixed(1)}</span></div>`).join('');
  }catch(e){ /* tetap tampilkan status terakhir */ }
}

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t));
  $('list-quake').hidden = t.dataset.tab !== 'quake';
  $('list-aq').hidden = t.dataset.tab !== 'aq';
  $('list-news').hidden = t.dataset.tab !== 'news';
  $('list-food').hidden = t.dataset.tab !== 'food';
  $('list-ask').hidden = t.dataset.tab !== 'ask';
});
$('hours').onchange = () => { loadQuakes(); loadFires(); };
$('minmag').onchange = loadQuakes;
$('news-topic').onchange = loadNews;
$('food-commodity').onchange = loadFood;

// ---------- Tanya AI ----------
const ASK_EXAMPLES = [
  'Berapa titik panas di Kalimantan Tengah 24 jam terakhir?',
  'Gempa terbesar dalam 3 hari terakhir di mana?',
  'Provinsi mana yang harga cabai rawitnya paling mahal?',
  'Bagaimana kualitas udara di Palembang sekarang?',
  'Berita karhutla terbaru di Sumatera Selatan',
  'Apakah ada masalah di pipeline data?',
];
const TOOL_LABEL = {gempa:'Gempa', titik_panas:'Titik panas', kualitas_udara:'Kualitas udara',
  harga_pangan:'Harga pangan', berita:'Berita', kesehatan_pipeline:'Kesehatan pipeline'};
$('ask-examples').innerHTML = ASK_EXAMPLES.map(q => `<button class="ask-ex">${esc(q)}</button>`).join('');
document.querySelectorAll('.ask-ex').forEach(b => b.onclick = () => { $('ask-q').value = b.textContent; askAI(); });
$('ask-btn').onclick = () => askAI();
$('ask-q').addEventListener('keydown', e => { if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)) askAI(); });

async function askAI(){
  const q = $('ask-q').value.trim(), out = $('ask-result'), btn = $('ask-btn');
  if(q.length < 3) return;
  btn.disabled = true;
  out.innerHTML = '<div class="empty">Mencari data dan menyusun jawaban…</div>';
  try{
    const r = await fetch('/api/ask', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                       body: JSON.stringify({question: q})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail || r.status);
    const tools = d.tools.map(t => TOOL_LABEL[t.nama] || t.nama).join(', ') || 'tidak ada';
    out.innerHTML = `
      <span class="ask-badge">Jawaban dibuat AI (${esc(d.model)}, model lokal) hanya dari data platform ini. Data dipakai: ${esc(tools)}. ${(d.ms / 1000).toFixed(1)} detik.</span>
      <div class="ask-answer">${esc(d.answer)}</div>
      ${(d.facts || []).length ? `<div class="ask-detail"><strong>Ringkasan data</strong>
        <span class="meta">(dihitung langsung oleh sistem, bukan AI)</span>
        <ul class="ask-facts">${d.facts.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
      ${d.sources.length ? `<div class="ask-detail ask-src"><strong>Sumber berita</strong>${d.sources.map(s =>
        `<a href="${esc(s.link)}" target="_blank" rel="noopener noreferrer">${esc(s.judul)}</a>`).join('')}</div>` : ''}
      <details class="ask-detail"><summary>Lihat data yang dipakai AI</summary>
        <pre>${esc(JSON.stringify({alat: d.tools, data: d.data}, null, 2))}</pre></details>`;
    if(d.focus) map.flyTo([d.focus.lat, d.focus.lng], d.focus.zoom, {duration: .8});
  }catch(e){
    out.innerHTML = `<div class="empty">AI belum bisa menjawab: ${esc(e.message)}</div>`;
  }finally{
    btn.disabled = false;
  }
}

const refreshAll = () => { loadQuakes(); loadFires(); loadAQ(); loadNews(); loadNewsGeo(); loadFood(); loadHealth(); };
refreshAll();
setInterval(refreshAll, 60000);
</script>
