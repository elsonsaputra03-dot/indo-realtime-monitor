name: visitor-report
on:
  schedule:
    - cron: "5 0 * * *"        # 07:05 WIB setiap hari (jadwal GitHub bisa terlambat beberapa menit)
  workflow_dispatch:            # tombol "Run workflow" untuk uji manual
    inputs:
      send_empty:
        description: "Kirim email walaupun tidak ada kunjungan (untuk uji)"
        default: "0"
      end_utc:
        description: "Uji ulang rentang 24 jam yang berakhir pada jam ini (UTC, mis. 2026-10-09T04:00:00Z); kosong = sekarang"
        default: ""
      dry_run:
        description: "1 = jangan kirim email"
        default: "0"
jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python scripts/visitor_report.py
        env:
          # Kode situs tidak rahasia (terlihat di sumber halaman): dibaca dari secret ATAU variable bila ada, jika tidak 'elsonsaputra'.
          GOATCOUNTER_CODE: ${{ secrets.GOATCOUNTER_CODE || vars.GOATCOUNTER_CODE || 'elsonsaputra' }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # penerima: REPORT_TO bila ada, jika tidak alamat alert yang sudah dipakai Indonesia Realtime Monitor
          REPORT_TO: ${{ secrets.REPORT_TO || vars.REPORT_TO || secrets.ALERT_EMAIL_TO }}
          SEND_EMPTY: ${{ github.event.inputs.send_empty || '0' }}
          END_UTC: ${{ github.event.inputs.end_utc || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
