name: scraper-tests
on:
  push:
    paths: ["airflow/**", "app/api/**", ".github/workflows/scrapers-tests.yml"]
  pull_request:
    paths: ["airflow/**", "app/api/**"]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install httpx==0.27.2 feedparser==6.0.11 beautifulsoup4==4.12.3 lxml==5.3.0 pytest
      - run: pytest -q airflow/tests        # tanpa jaringan: respons asli BMKG/GitHub + halaman HTML contoh
